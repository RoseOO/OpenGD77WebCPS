    <rect x="176" y="140" width="120" height="12" rx="4" fill="#667eea"/>
    <rect x="176" y="160" width="80" height="8" rx="3" fill="#48bb78"/>
    <rect x="176" y="176" width="100" height="8" rx="3" fill="#a0aec0"/>
    <rect x="176" y="192" width="60" height="8" rx="3" fill="#ed8936"/>
    <!-- Keypad -->
    <g fill="#2d3748">
      <rect x="168" y="240" width="48" height="32" rx="6"/>
      <rect x="232" y="240" width="48" height="32" rx="6"/>
      <rect x="296" y="240" width="48" height="32" rx="6"/>
      <rect x="168" y="284" width="48" height="32" rx="6"/>
      <rect x="232" y="284" width="48" height="32" rx="6"/>
      <rect x="296" y="284" width="48" height="32" rx="6"/>
      <rect x="168" y="328" width="48" height="32" rx="6"/>
      <rect x="232" y="328" width="48" height="32" rx="6"/>
      <rect x="296" y="328" width="48" height="32" rx="6"/>
      <rect x="168" y="372" width="48" height="32" rx="6"/>
      <rect x="232" y="372" width="48" height="32" rx="6"/>
      <rect x="296" y="372" width="48" height="32" rx="6"/>
    </g>
    <!-- Side buttons -->
    <rect x="376" y="140" width="12" height="40" rx="4" fill="#fff"/>
    <rect x="376" y="200" width="12" height="40" rx="4" fill="#fff"/>
    <!-- Antenna -->
    <rect x="200" y="48" width="24" height="64" rx="8" fill="#fff"/>
    <rect x="204" y="32" width="16" height="24" rx="6" fill="#fff"/>
